[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hapq"
version = "0.1.0"
description = "Hosted-agent prerequisite qualification kit for Microsoft Foundry"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
notebooks = ["nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6.29"]
# Needed from Phase A onwards (live hosted-agent tests); not installed in step 1.
lab = ["azure-identity>=1.25", "azure-ai-projects>=2.5.0", "httpx>=0.28", "a2a-sdk==1.0.2"]

[project.scripts]
hapq = "hapq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run is offline. Select live suites explicitly: -m azure, -m docs, -m lab_public ...
addopts = "-m 'not azure and not docs and not lab_public and not lab_private and not in_vnet'"
markers = [
  "azure: read-only calls against the subscription in .env",
  "docs: fetches public Microsoft Learn pages",
  "lab_public: requires the Phase A lab (not provisioned in step 1)",
  "lab_private: requires the Phase B private lab (not provisioned in step 1)",
  "in_vnet: must run from an execution point inside the lab VNet",
]
