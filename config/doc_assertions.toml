# Re-executable documentary checks against public Microsoft Learn pages.
# A documentary result says what the documentation states on the fetch date. It is never a
# demonstration on Azure.
#
# Each probe fetches `url`, optionally narrows the text to [section_start, section_end), then
# evaluates ONE of:
#   contains  = "phrase"            (case/whitespace-insensitive substring)
#   any_of    = ["a", "b"]          (true if any phrase is present)
#   list_item = "West Europe"       (true if a list item equals the value exactly)
# and compares the outcome with `expect` (default true).
# All probes meet expectation -> status `if_met`; otherwise -> `if_unmet`.
# A fetch failure -> BLOCKED (the source could not be read).
#
# polarity: support | limitation | contradiction | absence (how the matrix renders it).
# For `contradiction`, the probes look for both conflicting statements: "met" means the
# contradiction is still present in the docs. Contradictions are reported, never resolved here.

[[doc]]
id = "DOC-C01-GA-STATEMENT"
criterion = "C01"
polarity = "support"
title = "Docs state Foundry Hosted Agents is generally available"
if_met = "PASS"
if_unmet = "FAIL"
[[doc.probe]]
url = "https://learn.microsoft.com/en-us/agent-framework/hosting/foundry-hosted-agent"
contains = "Hosted Agents is generally available"

